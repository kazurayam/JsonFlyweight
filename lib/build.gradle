// JsonFlyweight/lib/build.gradle

plugins {
    id 'java-library'
    id 'com.vanniktech.maven.publish' version '0.34.0'
}

group 'com.kazurayam'
version '0.1.6'

ext {
    GitHubUserName = 'kazurayam'
}

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    // https://mvnrepository.com/artifact/org.slf4j/slf4j-api
    implementation 'org.slf4j:slf4j-api:2.0.13'

    testImplementation libs.testng
    testImplementation 'org.assertj:assertj-core:3.26.3'
    testImplementation 'ch.qos.logback:logback-classic:1.5.6'
    testImplementation 'com.kazurayam:unittest-helper:0.5.1'

    // for measurement of pretty-printers performance
    testImplementation 'com.google.code.gson:gson:2.11.0'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    testImplementation 'com.kazurayam:timekeeper:0.5.0-SNAPSHOT'
    testImplementation 'org.codehaus.groovy:groovy-all:3.0.22'

    // for creating a large JSON-formatted file (HAR) as fixture
    // see https://github.com/kazurayam/JsonFlyweight/issues/6
    testImplementation 'io.github.bonigarcia:webdrivermanager:5.9.1'
    testImplementation 'org.seleniumhq.selenium:selenium-java:4.23.0'
    testImplementation('net.lightbody.bmp:browsermob-core:2.1.5') {
        exclude group: "com.fasterxml.jackson.core", module: "*"
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(11)
    }
}


mavenPublishing{
    publishToMavenCentral()
    signAllPublications()

    coordinates(project.group,    // com.kazurayam
            'jsonflyweight',     // jsonflyweight
            project.version)              // e.g, 0.1.6

    pom {
        name.set(project.rootProject.name)
        description.set('A utility class which pretty prints a JSON very fast with minimum memory pressure')
        inceptionYear.set('2024')
        url.set("https://${GitHubUserName}.github.io/JsonFlyweight/")
        licenses {
            license {
                name.set('The Apache License, Version 2.0')
                url.set('https://www.apache.org.licenses/LICENSE-2.0.txt')
                distribution.set('http://www.apache.org/licenses/LICENSE-2.0.txt')
            }
        }
        developers {
            developer {
                id.set("${GitHubUserName}")
                name.set('URAYAMA,kazuaki')
                url.set("https://github.com/${GitHubUserName}/")
            }
        }
        scm {
            connection = "scm:git:https://github.com/${GitHubUserName}/${project.rootProject.name}.git"
            developerConnection = "scm:git:git@github.com:${GitHubUserName}/${project.rootProject.name}.git"
            url = "https://github.com/${GitHubUserName}/${project.rootProject.name}"
        }
    }
}

javadoc {
    title = "${project.rootProject.name} ${project.version}"
    options.showFromProtected()
    failOnError = false
    options.locale = "en_US"
}
tasks.register('copyJavadocToDocsDir', Copy) {
    from "build/docs/javadoc"
    into "../docs/api"
}
javadoc.finalizedBy copyJavadocToDocsDir

